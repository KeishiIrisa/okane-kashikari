name: Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - "backend/supabase/migrations/*.sql"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PostgreSQL client (psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply all migrations (002+)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL secret is not set"
            exit 1
          fi

          for f in $(ls backend/supabase/migrations/*.sql | sort | grep -v '001_initial_schema.sql'); do
            echo "Running $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "All migrations applied."

